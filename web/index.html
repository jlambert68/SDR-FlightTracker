<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SDR Flight Tracker</title><link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.126/Build/Cesium/Widgets/widgets.css"><link rel="stylesheet" href="/style.css?v=23"></head><body><div id="cesiumContainer"></div><aside id="aircraftList"><h1>Aircraft <span id="aircraftCount">0</span></h1><div id="aircraftRows"><p class="empty">Waiting for ADS-B messages…</p></div></aside><div id="status">Loading map…</div><aside id="cameraControls"><button id="homeButton" title="Fly to Tottkällevägen 4A">⌂ Tottkällevägen 4A</button><button id="topDownButton" title="Top-down view of Tottkällevägen 4A">⌖ Top-down home</button><label for="heightSlider">Camera height <output id="heightValue">5,000 ft</output></label><input id="heightSlider" type="range" min="1000" max="100000" step="250" value="5000"><div id="cameraInfo"><span>Camera position</span><b id="cameraCoordinates">—</b><span>Horizontal from home</span><b id="horizontalDistance">—</b><span>Vertical from home</span><b id="verticalDistance">—</b></div><details id="sightControls" open><summary>◇ Home sight volume</summary><p>H° bearing from north · V° above horizon</p><p id="sightAlertStatus">Sight bell: waiting for configuration</p><button id="testSightBell" type="button">Enable / test bell</button><label for="sightRange">Beam range <span><input id="sightRange" type="number" min="100" max="200000" step="100"> m</span></label><label for="sightOriginHeight">Origin height <span><input id="sightOriginHeight" type="number" min="-100" max="10000" step="1"> m</span></label><div class="sightBeamHead"><span>Beam</span><span>H°</span><span>V°</span></div><div id="sightBeamControls"></div><button id="resetSightVolume" type="button">Reset sight volume</button></details></aside><script src="https://cesium.com/downloads/cesiumjs/releases/1.126/Build/Cesium/Cesium.js"></script><script src="/app.js?v=25"></script></body></html>
